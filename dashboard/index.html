<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecAudit Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>🛡️ SecAudit-Toolkit Dashboard</h1>
        <p>Painel de Resultados da Auditoria de Segurança</p>
    </header>
    
    <main>
        <section id="windows-results">
            <h2>Resultados: Windows</h2>
            <div class="card-container">
                <!-- Card do Firewall -->
                <div id="firewall-card" class="card">
                    <h3>Firewall</h3>
                    <p>Aguardando dados...</p>
                </div>
                
                <!-- Card de Compartilhamentos -->
                <div id="smb-card" class="card">
                    <h3>Compartilhamentos (SMB)</h3>
                    <p>Aguardando dados...</p>
                </div>
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
